name: mesa

# Rebuild the backported Mesa with the piano patches (Adreno 830 chip id).
# Long job: run on demand or when the patches or the builder change.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'trixie-backports mesa source version'
        default: '26.1.6-1~bpo13+1'
        required: true
  pull_request:
    paths:
      - 'patches/mesa/**'
      - 'scripts/build-mesa-debs.sh'
      - '.github/workflows/mesa.yml'

permissions:
  contents: read

jobs:
  mesa:
    name: mesa
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5

      - name: Build
        env:
          VERSION: ${{ inputs.version || '26.1.6-1~bpo13+1' }}
        run: scripts/build-mesa-debs.sh out/mesa "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-debs
          path: out/mesa/
          retention-days: 30
